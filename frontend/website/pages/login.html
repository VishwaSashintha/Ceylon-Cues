<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Ceylon Cues</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <style>
    .cc-login-container {
      display: flex;
      min-height: 100vh;
    }
    .cc-login-brand-col {
      flex: 1;
      background: var(--primary);
      color: #fff;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      position: relative;
    }
    .cc-login-form-col {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 32px 24px;
    }
    .cc-login-box {
      width: 100%;
      max-width: 380px;
    }
    @media (max-width: 800px) {
      .cc-login-container {
        flex-direction: column;
      }
      .cc-login-brand-col {
        padding: 40px 24px;
        min-height: 200px;
      }
    }
  </style>
</head>
<body>
  <div class="cc-login-container">
    <!-- Brand Visual Column -->
    <div class="cc-login-brand-col">
      <a href="../index.html" class="t" style="font-size:28px; color:#fff; text-decoration:none;">
        CEYLON <span style="color:var(--gold);">CUES</span>
      </a>
      <h1 style="font:700 44px/1.1 var(--font-heading); margin:16px 0;">
        Precision.<br>Performance.<br>Passion.
      </h1>
      <p style="color:var(--primary-subtle); font-size:15px; margin:0; max-width:380px;">
        Official online store and operations management portal for professional billiard &amp; pool equipment in Sri Lanka.
      </p>
    </div>

    <!-- Sign In Form Column -->
    <div class="cc-login-form-col">
      <div class="cc-login-box">
        <h2 class="h">Sign in</h2>
        
        <!-- Role Mode Switcher -->
        <div style="display:flex; gap:8px; margin:16px 0;">
          <button type="button" class="b" id="btn-tab-customer" onclick="switchLoginType('customer')">Customer</button>
          <button type="button" class="b bo" id="btn-tab-staff" onclick="switchLoginType('staff')">Staff / Owner</button>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <label for="e">Email</label>
          <input id="e" class="i" type="email" placeholder="name@domain.com" required autocomplete="email">

          <label for="pw">Password</label>
          <input id="pw" class="i" type="password" placeholder="••••••••" required autocomplete="current-password">

          <!-- Staff / Owner 2FA OTP Field -->
          <div id="otp-group" style="display:none;">
            <label for="otp">Authenticator code (staff and owner)</label>
            <input id="otp" class="i" inputmode="numeric" placeholder="6-digit TOTP code" maxlength="6" autocomplete="one-time-code">
            <span class="m" style="font-size:12px; display:block; margin-top:4px;">Enter the code from your Google Authenticator or staff app</span>
          </div>

          <button type="submit" class="b" id="btn-submit-login" style="width:100%; height:52px; margin-top:20px; font-size:16px;">
            Sign in
          </button>
        </form>

        <p class="m" style="text-align:center; margin-top:20px;">
          <a href="#" onclick="alert('Password reset link sent to your email address.'); return false;" style="color:var(--primary); font-weight:500;">Forgot password?</a>
          &nbsp;·&nbsp;
          <a href="register.html" style="color:var(--primary); font-weight:600;">Create account</a>
        </p>

        <div style="margin-top:32px; padding-top:20px; border-top:1px solid var(--border-color); text-align:center;">
          <a href="../index.html" class="m" style="color:var(--text-muted);">&larr; Back to Ceylon Cues Store</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../js/website-api.js"></script>
  <script>
    let loginType = 'customer';

    // Check if query param specifies staff
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('type') === 'staff') {
      switchLoginType('staff');
    }

    function switchLoginType(type) {
      loginType = type;
      const custBtn = document.getElementById('btn-tab-customer');
      const staffBtn = document.getElementById('btn-tab-staff');
      const otpGroup = document.getElementById('otp-group');

      if (type === 'customer') {
        custBtn.className = 'b';
        staffBtn.className = 'b bo';
        otpGroup.style.display = 'none';
      } else {
        custBtn.className = 'b bo';
        staffBtn.className = 'b';
        otpGroup.style.display = 'block';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('e').value.trim();
      const password = document.getElementById('pw').value;
      const otp = document.getElementById('otp').value.trim();
      const btn = document.getElementById('btn-submit-login');

      btn.disabled = true;
      btn.innerHTML = `<span class="cc-spinner"></span> Signing in...`;

      try {
        const response = await WebsiteAPI.login(email, password, otp);
        const token = response.token || response.session_token || response.session_id;
        const user = response.user || response;

        if (token) {
          Auth.login(token, user);
          Utils.showToast(`Welcome back, ${user.name || 'User'}!`, 'success');

          setTimeout(() => {
            if (Auth.isStaff() || loginType === 'staff') {
              if (user.role === 'shop_cashier') {
                window.location.href = '../../pos/terminal.html';
              } else {
                window.location.href = '../../erp/index.html';
              }
            } else {
              window.location.href = 'account.html';
            }
          }, 600);
        } else {
          throw new Error('Invalid login response from server.');
        }
      } catch (err) {
        console.error('Login error:', err);
        btn.disabled = false;
        btn.innerHTML = `Sign in`;
        Utils.showToast(err.message || 'Invalid credentials or authenticator code.', 'error');
      }
    }
  </script>
</body>
</html>
