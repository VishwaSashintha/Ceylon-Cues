<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Ceylon Cues</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <style>
    .cc-login-container {
      display: flex;
      min-height: 100vh;
    }
    .cc-login-brand-col {
      flex: 1;
      background: var(--primary);
      color: #fff;
      padding: 64px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }
    .cc-login-form-col {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      padding: 40px 24px;
    }
    .cc-login-box {
      width: 100%;
      max-width: 420px;
    }
    @media (max-width: 800px) {
      .cc-login-container {
        flex-direction: column;
      }
      .cc-login-brand-col {
        padding: 40px 24px;
        min-height: 180px;
      }
    }
  </style>
</head>
<body>
  <div class="cc-login-container">
    <div class="cc-login-brand-col">
      <a href="../index.html" class="t" style="font-size:28px; color:#fff; text-decoration:none;">
        CEYLON <span style="color:var(--gold);">CUES</span>
      </a>
      <h1 style="font:700 44px/1.1 var(--font-heading); margin:16px 0;">
        Precision.<br>Performance.<br>Passion.
      </h1>
      <p style="color:var(--primary-subtle); font-size:15px; margin:0; max-width:380px;">
        Join Ceylon Cues for fast checkout, saved delivery addresses, order tracking, and exclusive player discounts.
      </p>
    </div>

    <div class="cc-login-form-col">
      <div class="cc-login-box">
        <h2 class="h">Create account</h2>
        <p class="m" style="margin:4px 0 20px;">Register for a Ceylon Cues customer account</p>

        <form id="register-form" onsubmit="handleRegister(event)">
          <label for="reg-name">Full name *</label>
          <input id="reg-name" class="i" placeholder="e.g. Kasun Silva" required>

          <label for="reg-email">Email address *</label>
          <input id="reg-email" class="i" type="email" placeholder="kasun@example.com" required>

          <label for="reg-phone">Phone number (WhatsApp) *</label>
          <input id="reg-phone" class="i" placeholder="0771234567" required>

          <label for="reg-password">Password (at least 8 characters) *</label>
          <input id="reg-password" class="i" type="password" placeholder="••••••••" required minlength="8">

          <label for="reg-confirm">Confirm password *</label>
          <input id="reg-confirm" class="i" type="password" placeholder="••••••••" required minlength="8">

          <div style="margin-top:16px; font-size:13px; display:flex; align-items:flex-start; gap:8px;">
            <input type="checkbox" id="terms-agree" required style="margin-top:3px;">
            <label for="terms-agree" style="font-weight:400; margin:0; line-height:1.4;">
              I agree to the Ceylon Cues <a href="policies.html#terms" style="color:var(--primary); font-weight:600;">Terms of Service</a> and <a href="policies.html#privacy" style="color:var(--primary); font-weight:600;">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="b" id="btn-submit-reg" style="width:100%; height:52px; margin-top:24px; font-size:16px;">
            Create account
          </button>
        </form>

        <p class="m" style="text-align:center; margin-top:24px;">
          Already have an account? <a href="login.html" style="color:var(--primary); font-weight:600;">Sign in here</a>
        </p>
      </div>
    </div>
  </div>

  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../js/website-api.js"></script>
  <script>
    async function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const phone = document.getElementById('reg-phone').value.trim();
      const pw = document.getElementById('reg-password').value;
      const confirm = document.getElementById('reg-confirm').value;

      if (pw !== confirm) {
        Utils.showToast('Passwords do not match.', 'error');
        return;
      }

      const btn = document.getElementById('btn-submit-reg');
      btn.disabled = true;
      btn.innerHTML = `<span class="cc-spinner"></span> Creating account...`;

      try {
        const response = await WebsiteAPI.register({
          name: name,
          email: email,
          phone: phone,
          password: pw,
          password_confirmation: confirm
        });

        const token = response.token || response.session_token;
        const user = response.user || { name, email, role: 'customer' };

        if (token) {
          Auth.login(token, user);
          Utils.showToast('Account created successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'account.html';
          }, 600);
        } else {
          Utils.showToast('Account created! Please sign in.', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 800);
        }
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `Create account`;
        Utils.showToast(err.message || 'Registration failed. Please check your details.', 'error');
      }
    }
  </script>
</body>
</html>
