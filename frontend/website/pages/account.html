<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account — Ceylon Cues</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../shared/css/variables.css">
  <link rel="stylesheet" href="../../shared/css/base.css">
  <link rel="stylesheet" href="../../shared/css/components.css">
  <link rel="stylesheet" href="../css/website.css">
  <style>
    .cc-account-layout {
      display: flex;
      gap: 32px;
      padding: 40px 48px;
    }
    .cc-account-nav {
      width: 240px;
      flex-shrink: 0;
    }
    .cc-account-nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-weight: 500;
      font-size: 14px;
      transition: var(--transition);
      margin-bottom: 4px;
    }
    .cc-account-nav a:hover {
      background: var(--primary-tint);
      color: var(--primary);
    }
    .cc-account-nav a.active {
      background: var(--primary);
      color: #fff;
      font-weight: 600;
    }
    .cc-account-content {
      flex: 1;
    }
    @media (max-width: 860px) {
      .cc-account-layout {
        flex-direction: column;
        padding: 20px;
      }
      .cc-account-nav {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="cc-topbar-mount"></div>
  <div id="cc-header-mount" data-active=""></div>

  <!-- Header -->
  <div style="background:#fff; border-bottom:1px solid var(--border-color); padding:24px 48px;">
    <div class="m" style="margin-bottom:6px;">
      <a href="../index.html">Home</a> &nbsp;/&nbsp; <span>Customer Portal</span>
    </div>
    <div class="r">
      <h1 class="h" style="font-size:32px;">My Account</h1>
      <button class="b bo" style="height:38px; font-size:13px;" onclick="Auth.logout('../index.html')">Sign Out</button>
    </div>
  </div>

  <div class="cc-account-layout">
    <!-- Sidebar Navigation -->
    <aside class="cc-account-nav">
      <div class="c" style="padding:16px;">
        <div style="padding:8px 8px 16px; border-bottom:1px solid var(--border-color); margin-bottom:12px;">
          <b id="user-display-name" style="font-size:16px; display:block;">Loading user...</b>
          <span id="user-display-email" class="m">customer@domain</span>
        </div>
        <a href="#orders" class="active" id="tab-link-orders" onclick="switchTab('orders')">
          📦 Order History
        </a>
        <a href="#profile" id="tab-link-profile" onclick="switchTab('profile')">
          👤 Profile Details
        </a>
        <a href="#addresses" id="tab-link-addresses" onclick="switchTab('addresses')">
          📍 Saved Addresses
        </a>
        <a href="wishlist.html" id="tab-link-wishlist">
          ❤️ Saved Wishlist
        </a>
        <a href="support.html" id="tab-link-support">
          🎫 Support Tickets
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="cc-account-content">
      
      <!-- TAB 1: Orders -->
      <section id="tab-orders">
        <div class="r" style="margin-bottom:16px;">
          <h2 style="font-size:20px; margin:0;">Your Orders</h2>
          <span class="m">Track, download tax invoices &amp; view delivery updates</span>
        </div>

        <div id="orders-list-container">
          <div class="c" style="text-align:center; padding:48px;">
            <span class="cc-spinner" style="width:32px; height:32px; color:var(--primary);"></span>
            <p class="m" style="margin-top:12px;">Loading your orders...</p>
          </div>
        </div>
      </section>

      <!-- TAB 2: Profile -->
      <section id="tab-profile" style="display:none;">
        <div class="c">
          <h2 style="font-size:20px; margin:0 0 16px;">Profile Information</h2>
          <form id="profile-form" onsubmit="handleUpdateProfile(event)">
            <label for="prof-name">Full Name</label>
            <input id="prof-name" class="i" required>

            <label for="prof-email">Email Address</label>
            <input id="prof-email" type="email" class="i" disabled style="background:#F9FAFB;">

            <label for="prof-phone">WhatsApp Contact Phone</label>
            <input id="prof-phone" class="i" placeholder="0771234567">

            <button type="submit" class="b" style="margin-top:20px;">Save Profile Changes</button>
          </form>
        </div>
      </section>

      <!-- TAB 3: Addresses -->
      <section id="tab-addresses" style="display:none;">
        <div class="c">
          <h2 style="font-size:20px; margin:0 0 16px;">Default Delivery Address</h2>
          <form id="address-form" onsubmit="handleSaveAddress(event)">
            <label for="addr-street">Street Address</label>
            <input id="addr-street" class="i" placeholder="House / Flat No, Street">

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:12px;">
              <div>
                <label for="addr-district">District</label>
                <select id="addr-district" class="i">
                  <option value="Colombo">Colombo</option>
                  <option value="Gampaha">Gampaha</option>
                  <option value="Kalutara">Kalutara</option>
                  <option value="Kandy">Kandy</option>
                  <option value="Galle">Galle</option>
                  <option value="Matara">Matara</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label for="addr-city">City / Postal Town</label>
                <input id="addr-city" class="i" placeholder="e.g. Maharagama">
              </div>
            </div>

            <button type="submit" class="b" style="margin-top:20px;">Update Default Address</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div id="cc-footer-mount"></div>

  <script src="../../shared/js/api.js"></script>
  <script src="../../shared/js/auth.js"></script>
  <script src="../../shared/js/utils.js"></script>
  <script src="../js/website-api.js"></script>
  <script src="../js/cart-state.js"></script>
  <script src="../js/site-shell.js"></script>
  <script>
    async function initAccount() {
      if (!Auth.isAuthenticated()) {
        window.location.href = 'login.html';
        return;
      }

      const user = Auth.getUser();
      if (user) {
        document.getElementById('user-display-name').textContent = user.name || 'Valued Customer';
        document.getElementById('user-display-email').textContent = user.email || '';
        document.getElementById('prof-name').value = user.name || '';
        document.getElementById('prof-email').value = user.email || '';
        document.getElementById('prof-phone').value = user.phone || '';
      }

      await loadOrders();
    }

    function switchTab(tab) {
      ['orders', 'profile', 'addresses'].forEach(t => {
        document.getElementById(`tab-${t}`).style.display = (t === tab) ? 'block' : 'none';
        const link = document.getElementById(`tab-link-${t}`);
        if (link) link.className = (t === tab) ? 'active' : '';
      });
    }

    async function loadOrders() {
      const container = document.getElementById('orders-list-container');
      try {
        const response = await WebsiteAPI.getMyOrders();
        const orders = response.items || (Array.isArray(response) ? response : []);

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="c cc-empty-state" style="padding:48px 20px;">
              <div style="font-size:40px;">📦</div>
              <h3>No orders placed yet</h3>
              <p class="m">When you place an order on Ceylon Cues, your order status and invoice will appear here.</p>
              <a href="products.html" class="b" style="margin-top:16px;">Browse Catalogue</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(ord => {
          const status = ord.status || 'pending';
          let statusBadgeClass = '';
          if (status === 'delivered') statusBadgeClass = 'success';
          else if (status === 'cancelled') statusBadgeClass = 'error';
          else if (status === 'shipped' || status === 'processing') statusBadgeClass = 'info';

          const formattedDate = Utils.formatDate(ord.created_at, true);
          const totalFormatted = Utils.formatLKR(ord.total_amount || ord.grand_total || 0);
          const orderNum = ord.order_number || `CC-ORD-${ord.id}`;

          return `
            <div class="c" style="margin-bottom:16px; padding:20px;">
              <div class="r" style="margin-bottom:12px; border-bottom:1px solid var(--border-color); padding-bottom:12px;">
                <div>
                  <b style="font-size:16px;">${Utils.escapeHtml(orderNum)}</b>
                  <div class="m" style="margin-top:2px;">Placed on ${formattedDate}</div>
                </div>
                <div style="text-align:right;">
                  <span class="p ${statusBadgeClass}">${status.toUpperCase().replace('_', ' ')}</span>
                  <div style="font:700 18px var(--font-heading); margin-top:4px;">${totalFormatted}</div>
                </div>
              </div>
              <div class="r">
                <div class="m">
                  Payment: <b>${Utils.escapeHtml((ord.payment_method || 'Bank Transfer').replace('_', ' ').toUpperCase())}</b> · 
                  Delivery: <b>${ord.delivery_method === 'shop' ? 'Shop Pickup' : 'Courier Delivery'}</b>
                </div>
                <div style="display:flex; gap:8px;">
                  <a href="order-detail.html?id=${ord.id}" class="b bo" style="height:36px; padding:0 14px; font-size:13px;">View Details &rarr;</a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load orders:', err);
        container.innerHTML = `
          <div class="c cc-empty-state">
            <p class="m">Unable to load order history. Please try refreshing.</p>
          </div>
        `;
      }
    }

    async function handleUpdateProfile(e) {
      e.preventDefault();
      const name = document.getElementById('prof-name').value.trim();
      const phone = document.getElementById('prof-phone').value.trim();
      try {
        await WebsiteAPI.updateProfile({ name, phone });
        Auth.updateUser({ name, phone });
        document.getElementById('user-display-name').textContent = name;
        Utils.showToast('Profile updated successfully.', 'success');
      } catch (err) {
        Utils.showToast(err.message || 'Failed to update profile.', 'error');
      }
    }

    function handleSaveAddress(e) {
      e.preventDefault();
      Utils.showToast('Delivery address saved to profile.', 'success');
    }

    initAccount();
  </script>
</body>
</html>
